name: Release

# Bump the version in manifest.json and versions.json, commit, then push a tag
# with the same version (e.g. `git tag 0.1.3 && git push origin 0.1.3`).
# This publishes the release with main.js, manifest.json and styles.css and
# signs them with GitHub artifact attestations.
on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches manifest version
        run: |
          tag="${GITHUB_REF_NAME}"
          version="$(jq -r .version manifest.json)"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $tag does not match manifest version $version"
            exit 1
          fi

      - name: Attest release files
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" main.js manifest.json styles.css --clobber
          else
            gh release create "$tag" --title "$tag" --generate-notes main.js manifest.json styles.css
          fi
